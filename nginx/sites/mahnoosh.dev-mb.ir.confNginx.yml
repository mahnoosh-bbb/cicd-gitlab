server {
    listen 80;
    server_name mahnoosh.dev-mb.ir;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name mahnoosh.dev-mb.ir;
    access_log syslog:server=192.168.6.253:5140,tag=nginx_access  json_log;
    access_log /var/log/nginx/mahnoosh.dev-mb.ir.log json_log;

    ssl_certificate /etc/letsencrypt/live/mahnoosh.dev-mb.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahnoosh.dev-mb.ir/privkey.pem;

    # SSL configurations (adjust as needed)

    location / {
        proxy_pass http://192.168.6.117;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }
}
